[project]
name = "train-sandbox"
version = "0.1.0"
description = "3D 火车沙盘游戏：用轨道件拼出闭环线路，跑绿皮车 / 和谐号 / 复兴号"
requires-python = ">=3.12"

# core/ 只依赖标准库 + numpy；pygame 等留待 render/ 层。
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# render/ 与 app/ 层需要（M0 起已启用）
render = ["panda3d==1.10.16", "panda3d-gltf==1.3.0"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
